name: yaabsa_flutter_tts_windows
description: Windows flutter_tts implementation with lazy native initialization.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: flutter_tts
    platforms:
      windows:
        pluginClass: YaabsaFlutterTtsWindowsPlugin
