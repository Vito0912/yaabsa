name: foliate_reader
description: An internal package for foliate-js
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  zikzak_inappwebview:
    git:
      url: https://github.com/arrrrny/zikzak_inappwebview.git
      path: zikzak_inappwebview
      ref: fix/linux-blue-screen-and-devtools
  path: ^1.9.1

dev_dependencies: 
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/reader.html
    - assets/reader-app.js
    - foliate-js/view.js
    - foliate-js/epub.js
    - foliate-js/epubcfi.js
    - foliate-js/mobi.js
    - foliate-js/fb2.js
    - foliate-js/comic-book.js
    - foliate-js/fixed-layout.js
    - foliate-js/overlayer.js
    - foliate-js/paginator.js
    - foliate-js/progress.js
    - foliate-js/search.js
    - foliate-js/text-walker.js
    - foliate-js/vendor/fflate.js
    - foliate-js/vendor/zip.js
