name: yaabsa
description: "An improved cross-platform app for Audiobookshelf"
publish_to: 'none'

# Always use build numbers divisible by 3!
version: 1.17.0+165

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^2.0.0
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^1.3.1

  # Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.8


  # Misc
  uuid: ^4.6.0
  intl: ^0.20.3
  timezone: ^0.11.2

  sembast: ^3.10.1

  # Core
  just_audio:
    path: ./packages/just_audio/just_audio
  audio_service:
    path: ./packages/audio_service/audio_service
  audio_session: ^0.2.4
  dio: ^5.11.1
  jose: ^0.3.5+2
  native_dio_adapter: ^1.8.0
  crypto: ^3.0.8
  drift: ^2.35.4
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.9.1
  cached_network_image_ce: ^4.13.2
  go_router: ^18.1.4
  

  hooks_riverpod: ^3.5.0
  flutter_riverpod: ^3.5.0
  flutter_hooks: ^0.21.4
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.3
  app_links: ^7.2.2
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  file_picker: ^13.3.3
  desktop_drop: ^0.8.4
  flutter_secure_storage: ^11.2.0
  rxdart: ^0.28.0
  background_downloader: ^9.6.6

  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  sensors_plus: ^7.1.1 # Should be setup for Android, iOS, macOS, Windows | Testing needed for iOS, macOS, Windows | https://pub.dev/packages/sensors_plus
  vibration: ^3.2.1
  wakelock_plus: ^1.8.2
  flutter_html: ^3.0.0
  flutter_quill: ^11.6.0
  html: 0.15.6
  dart_quill_delta: ^10.8.3
  socket_io_client: ^3.1.6

  timeago: ^3.7.1

  pdfrx: ^2.12.0
  foliate_reader:
    path: ./packages/foliate_reader

  ## Platform
  just_audio_media_kit:
    path: ./packages/just_audio_media_kit
  tray_manager: ^0.9.0
  window_manager: ^0.7.0
  screen_retriever: ^0.4.0

  ## Windows
  audio_service_win:
    path: ./packages/audio_service_win
  media_kit_libs_windows_audio:
    git:
      url: https://github.com/Vito0912/media-kit.git
      ref: aed5d67c9364e7e67361cba5947fdec6af1ffca4
      path: libs/windows/media_kit_libs_windows_audio

  ## Linux
  audio_service_mpris: ^1.0.0-beta.4 # Needs to be tested
  media_kit_libs_linux: any

  ## MacOS

  ## iOS

  ## Android
  upnp_client:
    git:
      url: https://github.com/Hillpro/upnp_client.git
      ref: d6be3dc727db29056221313df906cd0fca6e1877
  flutter_chrome_cast: ^2.0.0
  flutter_tts: ^4.2.5
  sembast_web: ^2.4.7

  ## Wear OS
  wear_plus:
    path: ./packages/wear_plus

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.3
  riverpod_generator: ^4.0.10
  flutter_launcher_icons: ^0.14.4


dependency_overrides:
  audio_service_platform_interface:
    path: ./packages/audio_service/audio_service_platform_interface
  just_audio_platform_interface:
    path: ./packages/just_audio/just_audio_platform_interface
  dbus: ^0.8.0

flutter:
  uses-material-design: true

  assets:
    - CHANGELOG.md
    - assets/logo_blue_fill.png
