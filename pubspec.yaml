name: yaabsa
description: "An improved cross-platform app for Audiobookshelf"
publish_to: 'none'

# Always use build numbers divisible by 3!
version: 1.9.0+126

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.9
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^1.2.0

  # Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.6


  # Misc
  uuid: ^4.6.0
  intl: ^0.20.3

  sembast: ^3.8.10-1

  # Core
  just_audio:
    path: ./packages/just_audio/just_audio
  audio_service:
    path: ./packages/audio_service/audio_service
  dio: ^5.11.0
  native_dio_adapter: ^1.8.0
  crypto: ^3.0.7
  drift: ^2.34.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.1
  cached_network_image_ce: ^4.10.0
  go_router: ^17.4.0
  

  hooks_riverpod: ^3.4.2
  flutter_riverpod: ^3.4.2
  flutter_hooks: ^0.21.3+1
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  file_picker: ^12.0.0-beta.7 # https://github.com/miguelpruivo/flutter_file_picker/pull/1981#issuecomment-4288987328
  desktop_drop: ^0.7.1
  flutter_secure_storage: ^11.0.0
  rxdart: ^0.28.0
  background_downloader: ^9.5.7

  package_info_plus: ^10.2.1  # Need to wait on file_picker
  device_info_plus: ^13.2.0 # Need to wait for package_info_plis
  sensors_plus: ^7.1.0 # Should be setup for Android, iOS, macOS, Windows | Testing needed for iOS, macOS, Windows | https://pub.dev/packages/sensors_plus
  vibration: ^3.2.0
  wakelock_plus: 1.6.1 # 1.7.0 currently broken on Android https://github.com/fluttercommunity/wakelock_plus/issues/141
  flutter_html: ^3.0.0
  flutter_quill: ^11.5.1
  html: ^0.15.6
  dart_quill_delta: ^10.8.3
  socket_io_client: ^3.1.6

  timeago: ^3.7.1

  pdfrx: ^2.4.7
  foliate_reader:
    path: ./packages/foliate_reader

  ## Platform
  just_audio_media_kit: ^2.1.0
  tray_manager: ^0.5.3

  ## Windows
  audio_service_win:
    path: ./packages/audio_service_win
  media_kit_libs_windows_audio: any

  ## Linux
  audio_service_mpris: ^0.2.1 # Needs to be tested
  media_kit_libs_linux: any

  ## MacOS

  ## iOS

  ## Android
  flutter_chrome_cast: ^1.4.6
  flutter_tts: ^4.2.5
  sembast_web: ^2.4.5+1

  ## Wear OS
  wear_plus: ^1.2.5

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  drift_dev: ^2.34.5
  riverpod_generator: ^4.0.8
  flutter_launcher_icons: ^0.14.4


dependency_overrides:
  audio_service_platform_interface:
    path: ./packages/audio_service/audio_service_platform_interface
  just_audio_platform_interface:
    path: ./packages/just_audio/just_audio_platform_interface

flutter:
  uses-material-design: true

  assets:
    - assets/logo_blue_fill.png
