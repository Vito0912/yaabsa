name: Build release artifacts

on:
  push:
    paths:
      - "lib/**"
      - "linux/**"
      - "windows/**"
      - "android/**"
      - "ios/**"
      - "macos/**"
      - "web/**"
      - "pubspec.yaml"
      - ".github/workflows/build.yml"
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      force_version_bump:
        description: "Treat current pubspec version as bumped"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-build
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lib: ${{ steps.filter.outputs.lib }}
      android: ${{ steps.filter.outputs.android }}
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
      ios: ${{ steps.filter.outputs.ios }}
      macos: ${{ steps.filter.outputs.macos }}
      web: ${{ steps.filter.outputs.web }}
      pubspec: ${{ steps.filter.outputs.pubspec }}
      any: ${{ steps.filter.outputs.any }}
      build_skip: ${{ steps.build_skip.outputs.build_skip }}
      version_bumped: ${{ steps.version.outputs.version_bumped }}
      force_version_bump: ${{ steps.version.outputs.force_version_bump }}
      app_version: ${{ steps.version.outputs.app_version }}
      previous_app_version: ${{ steps.version.outputs.previous_app_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      platform_filter: ${{ steps.platforms.outputs.platform_filter }}
      build_linux: ${{ steps.platforms.outputs.build_linux }}
      build_flatpak: ${{ steps.platforms.outputs.build_flatpak }}
      build_android: ${{ steps.platforms.outputs.build_android }}
      build_windows: ${{ steps.platforms.outputs.build_windows }}
      build_ios: ${{ steps.platforms.outputs.build_ios }}
      build_macos: ${{ steps.platforms.outputs.build_macos }}
      build_web: ${{ steps.platforms.outputs.build_web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            lib:
              - 'lib/**'
            android:
              - 'android/**'
            linux:
              - 'linux/**'
            windows:
              - 'windows/**'
            ios:
              - 'ios/**'
            macos:
              - 'macos/**'
            web:
              - 'web/**'
            pubspec:
              - 'pubspec.yaml'
            any:
              - 'lib/**'
              - 'android/**'
              - 'linux/**'
              - 'windows/**'
              - 'ios/**'
              - 'macos/**'
              - 'web/**'
              - 'pubspec.yaml'
              - '.github/workflows/build.yml'

      - name: Detect build skip flag from commit message
        id: build_skip
        shell: bash
        run: |
          set -euo pipefail

          build_skip="false"
          commit_message=""

          if [[ "${{ github.event_name }}" == "push" ]]; then
            commit_message="$(git log -1 --format=%B "${{ github.sha }}" || true)"
          fi

          if [[ -n "$commit_message" ]]; then
            lower_message="$(printf '%s' "$commit_message" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lower_message" == *"skip ci"* || "$lower_message" == *"build skip"* ]]; then
              build_skip="true"
            fi
          fi

          echo "build_skip=$build_skip" >> "$GITHUB_OUTPUT"
          echo "Build skip requested: $build_skip"

          if [[ "$build_skip" == "true" ]]; then
            echo "Running just requirements"
          fi

      - name: Detect pubspec version bump
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml || true)"
          if [[ -z "$current_version" ]]; then
            echo "Unable to detect current pubspec version from pubspec.yaml"
            exit 1
          fi

          previous_version=""
          base_ref="${{ github.event.before }}"

          if [[ "${{ github.event_name }}" == "push" && -n "$base_ref" && "$base_ref" != "0000000000000000000000000000000000000000" ]]; then
            previous_version="$(git show "$base_ref":pubspec.yaml 2>/dev/null | awk '/^version:/ {print $2; exit}' || true)"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            previous_version="$(git show HEAD^:pubspec.yaml 2>/dev/null | awk '/^version:/ {print $2; exit}' || true)"
          fi

          version_bumped="false"
          if [[ -n "$current_version" && -n "$previous_version" && "$current_version" != "$previous_version" ]]; then
            version_bumped="true"
          fi

          force_version_bump="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_version_bump || 'false' }}"
          if [[ "$force_version_bump" == "true" ]]; then
            version_bumped="true"
          fi

          version_without_build="${current_version%%+*}"
          file_version="v${version_without_build}"
          release_tag="${file_version}"

          echo "app_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "previous_app_version=$previous_version" >> "$GITHUB_OUTPUT"
          echo "version_bumped=$version_bumped" >> "$GITHUB_OUTPUT"
          echo "force_version_bump=$force_version_bump" >> "$GITHUB_OUTPUT"
          echo "file_version=$file_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          echo "Detected version: '$current_version' (previous: '$previous_version')"
          echo "File version label: $file_version"
          echo "Force version bump override: $force_version_bump"
          echo "Version bumped: $version_bumped"

      - name: Select platforms from commit message
        id: platforms
        shell: bash
        run: |
          set -euo pipefail

          commit_messages=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            commit_messages="$(git log -1 --format=%B "${{ github.sha }}" || true)"
          fi

          lower_messages="$(printf '%s' "$commit_messages" | tr '[:upper:]' '[:lower:]')"
          markers="$(
            printf '%s\n' "$lower_messages" \
              | grep -Eio '\[platforms?:[^]]+\]|\[(android|aaos|automotive|wearos|wear os|linux|flatpak|windows|ios|macos|mac os|osx|web)\]|\((android|aaos|automotive|wearos|wear os|linux|flatpak|windows|ios|macos|mac os|osx|web)\)' \
              || true
          )"

          platform_filter="false"
          selected_android="false"
          selected_linux="false"
          selected_flatpak="false"
          selected_windows="false"
          selected_ios="false"
          selected_macos="false"
          selected_web="false"

          if [[ -n "$markers" && "${{ steps.version.outputs.version_bumped }}" != "true" ]]; then
            platform_filter="true"
            [[ "$markers" =~ android|aaos|automotive|wearos|wear[[:space:]]os ]] && selected_android="true"
            [[ "$markers" =~ linux ]] && selected_linux="true"
            [[ "$markers" =~ linux|flatpak ]] && selected_flatpak="true"
            [[ "$markers" =~ windows ]] && selected_windows="true"
            [[ "$markers" =~ (^|[^a-z])ios([^a-z]|$) ]] && selected_ios="true"
            [[ "$markers" =~ macos|mac[[:space:]]os|osx ]] && selected_macos="true"
            [[ "$markers" =~ web ]] && selected_web="true"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.version.outputs.version_bumped }}" == "true" ]]; then
            build_linux="true"
            build_flatpak="true"
            build_android="true"
            build_windows="true"
            build_ios="true"
            build_macos="true"
            build_web="true"
          elif [[ "$platform_filter" == "true" ]]; then
            build_linux="$selected_linux"
            build_flatpak="$selected_flatpak"
            build_android="$selected_android"
            build_windows="$selected_windows"
            build_ios="$selected_ios"
            build_macos="$selected_macos"
            build_web="$selected_web"
          else
            build_linux="${{ steps.filter.outputs.lib == 'true' || steps.filter.outputs.linux == 'true' }}"
            build_flatpak="${{ steps.filter.outputs.lib == 'true' || steps.filter.outputs.linux == 'true' }}"
            build_android="${{ steps.filter.outputs.lib == 'true' || steps.filter.outputs.android == 'true' }}"
            build_windows="${{ steps.filter.outputs.lib == 'true' || steps.filter.outputs.windows == 'true' }}"
            build_ios="${{ steps.filter.outputs.lib == 'true' || steps.filter.outputs.ios == 'true' }}"
            build_macos="${{ steps.filter.outputs.lib == 'true' || steps.filter.outputs.macos == 'true' }}"
            build_web="${{ steps.filter.outputs.lib == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.linux == 'true' }}"
          fi

          echo "platform_filter=$platform_filter" >> "$GITHUB_OUTPUT"
          echo "build_linux=$build_linux" >> "$GITHUB_OUTPUT"
          echo "build_flatpak=$build_flatpak" >> "$GITHUB_OUTPUT"
          echo "build_android=$build_android" >> "$GITHUB_OUTPUT"
          echo "build_windows=$build_windows" >> "$GITHUB_OUTPUT"
          echo "build_ios=$build_ios" >> "$GITHUB_OUTPUT"
          echo "build_macos=$build_macos" >> "$GITHUB_OUTPUT"
          echo "build_web=$build_web" >> "$GITHUB_OUTPUT"

          echo "Commit platform markers: ${markers:-none}"
          echo "Platform override active: $platform_filter"
          echo "Selected builds: linux=$build_linux flatpak=$build_flatpak android=$build_android windows=$build_windows ios=$build_ios macos=$build_macos web=$build_web"

      - name: Extract changelog for current version
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.app_version }}"
          version_without_build="${version%%+*}"

          changelog=$(awk -v ver="$version_without_build" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          changelog=$(echo "$changelog" | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba}')

          if [[ -z "$changelog" ]]; then
            echo "No changelog found for version $version_without_build"
            changelog="No changelog available for this version."
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$changelog"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "$changelog"

  check-requirements:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.any == 'true' || needs.changes.outputs.version_bumped == 'true') && needs.changes.outputs.build_skip != 'true' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run check
        uses: ./.github/actions/check-requirements
      
  build-linux:
    runs-on: ubuntu-latest
    needs:
      - changes
      - check-requirements
    if: ${{ needs.changes.outputs.build_linux == 'true' && needs.changes.outputs.build_skip != 'true' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt install -y build-essential libgtk-3-dev libgtk-3-0 libblkid1 liblzma5 libsecret-1-0 libsecret-1-dev libmpv-dev mpv libayatana-appindicator3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Post Get
        uses: ./.github/actions/post-get
        with:
          flow: build-linux

      - name: Install packaging tools
        run: |
          sudo apt-get install -y patchelf dpkg-dev rpm
          wget -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Build bundle
        run: flutter build linux --release

      - name: Package Linux bundle artifact
        shell: bash
        env:
          FILE_VERSION: ${{ needs.changes.outputs.file_version }}
        run: |
          set -euo pipefail

          bundle_dir="$(find build/linux -type d -path '*/release/bundle' | head -n 1)"
          if [[ -z "$bundle_dir" ]]; then
            echo "Linux release bundle directory not found."
            exit 1
          fi

          mkdir -p output/linux
          tar -C "$bundle_dir" -czf "output/linux/yaabsa_${FILE_VERSION}.tar.gz" .

      - name: Upload Linux bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: output/linux/yaabsa_*.tar.gz

      - name: Build appimage
        run: bash linux/packaging/appimage/build.sh

      - name: Rename Linux appimage artifact
        shell: bash
        env:
          FILE_VERSION: ${{ needs.changes.outputs.file_version }}
        run: |
          set -euo pipefail

          appimage_file="$(find output/linux -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          if [[ -z "$appimage_file" ]]; then
            echo "Linux AppImage artifact not found."
            exit 1
          fi

          mv "$appimage_file" "output/linux/yaabsa_${FILE_VERSION}.AppImage"

      - name: Upload Linux appimage artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: output/linux/yaabsa_*.AppImage

      - name: Build deb
        run: bash linux/packaging/deb/build.sh

      - name: Rename Linux deb artifact
        shell: bash
        env:
          FILE_VERSION: ${{ needs.changes.outputs.file_version }}
        run: |
          set -euo pipefail

          deb_file="$(find output/linux -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          if [[ -z "$deb_file" ]]; then
            echo "Linux deb artifact not found."
            exit 1
          fi

          mv "$deb_file" "output/linux/yaabsa_${FILE_VERSION}.deb"

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: output/linux/yaabsa_*.deb

      - name: Build rpm
        run: bash linux/packaging/rpm/build.sh

      - name: Rename Linux rpm artifact
        shell: bash
        env:
          FILE_VERSION: ${{ needs.changes.outputs.file_version }}
        run: |
          set -euo pipefail

          rpm_file="$(find output/linux -maxdepth 1 -type f -name '*.rpm' | head -n 1)"
          if [[ -z "$rpm_file" ]]; then
            echo "Linux rpm artifact not found."
            exit 1
          fi

          mv "$rpm_file" "output/linux/yaabsa_${FILE_VERSION}.rpm"

      - name: Upload Linux rpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-rpm
          path: output/linux/yaabsa_*.rpm

  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            flutter_arch: x64
          - arch: aarch64
            runner: ubuntu-26.04-arm
            flutter_arch: arm64
    runs-on: ${{ matrix.runner }}
    needs:
      - changes
      - check-requirements
    if: ${{ needs.changes.outputs.build_flatpak == 'true' && needs.changes.outputs.build_skip != 'true' }}
    timeout-minutes: 60
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Flutter (x86_64)
        if: ${{ matrix.flutter_arch == 'x64' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: ${{ matrix.flutter_arch }}
          cache: true

      - name: Determine current stable Flutter version (aarch64)
        if: ${{ matrix.flutter_arch == 'arm64' }}
        id: flutter_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl --fail --silent --show-error --location \
            https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            | jq -r '[.releases[] | select(.channel == "stable")] | .[0].version')"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Unable to determine the current stable Flutter version."
            exit 1
          fi
          echo "Using Flutter stable version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter (aarch64)
        if: ${{ matrix.flutter_arch == 'arm64' }}
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          architecture: ${{ matrix.flutter_arch }}
          cache: true

      - name: Update apt
        run: |
          sudo apt-get update

      - name: Install apt dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libgtk-3-0 \
            libblkid1 \
            liblzma5 \
            libsecret-1-0 \
            libsecret-1-dev \
            libmpv-dev \
            libayatana-appindicator3-dev \
            mpv \
            flatpak \
            flatpak-builder

          flatpak-builder --version

      - name: Install dependencies
        run: flutter pub get

      - name: Post Get
        uses: ./.github/actions/post-get
        with:
          flow: build-flatpak

      - name: Update Flatpak metainfo
        shell: bash
        env:
          APP_VERSION: ${{ needs.changes.outputs.app_version }}
        run: |
          set -euo pipefail
          version="${APP_VERSION%%+*}"
          today="$(date +%Y-%m-%d)"
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\" />|<release version=\"${version}\" date=\"${today}\" />|" linux/packaging/flatpak/de.vito0912.yaabsa.metainfo.xml
          echo "Updated metainfo.xml: version=$version date=$today"
          cat linux/packaging/flatpak/de.vito0912.yaabsa.metainfo.xml

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Install Flatpak runtime and SDK
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Validate Flatpak signing secrets
        if: github.ref == 'refs/heads/master'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "Missing secret: FLATPAK_GPG_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "$FLATPAK_GPG_KEY_ID" ]; then
            echo "Missing secret: FLATPAK_GPG_KEY_ID"
            exit 1
          fi

      - name: Configure GPG signing key
        if: github.ref == 'refs/heads/master'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "$FLATPAK_GPG_PASSPHRASE" ]; then
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            echo "default-cache-ttl 7200" >> ~/.gnupg/gpg-agent.conf
            echo "max-cache-ttl 7200" >> ~/.gnupg/gpg-agent.conf
            gpgconf --kill gpg-agent
            gpgconf --launch gpg-agent
            printf 'unlock' > /tmp/gpg-unlock.txt
            gpg --batch --yes --pinentry-mode loopback --passphrase "$FLATPAK_GPG_PASSPHRASE" --local-user "$FLATPAK_GPG_KEY_ID" --output /tmp/gpg-unlock.sig --detach-sign /tmp/gpg-unlock.txt
          fi

      - name: Build Flatpak repo
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            flatpak-builder --arch="${{ matrix.arch }}" --user --install-deps-from=flathub --force-clean --repo=flatpak-repo --default-branch=master --gpg-sign="$FLATPAK_GPG_KEY_ID" flatpak-build linux/packaging/flatpak/de.vito0912.yaabsa.yml
          else
            flatpak-builder --arch="${{ matrix.arch }}" --user --install-deps-from=flathub --force-clean --repo=flatpak-repo --default-branch=master flatpak-build linux/packaging/flatpak/de.vito0912.yaabsa.yml
          fi
          if ! find flatpak-build/files -maxdepth 5 -type f -name 'libmpv.so*' | grep -q .; then
            echo "libmpv was not bundled into the Flatpak image."
            exit 1
          fi

      - name: Finalize signed Flatpak repo
        if: github.ref == 'refs/heads/master'
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY_ID" --generate-static-deltas --prune flatpak-repo

      - name: Upload Flatpak repository artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: flatpak-repo

      - name: Build Flatpak bundle for master
        if: github.ref == 'refs/heads/master'
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: flatpak build-bundle --arch="${{ matrix.arch }}" --gpg-sign="$FLATPAK_GPG_KEY_ID" flatpak-repo "de.vito0912.yaabsa_${{ matrix.arch }}.flatpak" de.vito0912.yaabsa master

      - name: Build Flatpak bundle for non-master
        if: github.ref != 'refs/heads/master'
        run: flatpak build-bundle --arch="${{ matrix.arch }}" flatpak-repo "de.vito0912.yaabsa_${{ matrix.arch }}.flatpak" de.vito0912.yaabsa master

      - name: Rename Flatpak artifact
        shell: bash
        env:
          FILE_VERSION: ${{ needs.changes.outputs.file_version }}
        run: |
          set -euo pipefail

          if [[ ! -f "de.vito0912.yaabsa_${{ matrix.arch }}.flatpak" ]]; then
            echo "Flatpak bundle not found."
            exit 1
          fi

          mkdir -p output/linux
          mv "de.vito0912.yaabsa_${{ matrix.arch }}.flatpak" "output/linux/yaabsa_${FILE_VERSION}_${{ matrix.arch }}.flatpak"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-flatpak-${{ matrix.arch }}
          path: output/linux/yaabsa_*_${{ matrix.arch }}.flatpak

  combine-flatpak:
    runs-on: ubuntu-26.04
    needs:
      - build-flatpak
    if: ${{ github.ref == 'refs/heads/master' && needs.build-flatpak.result == 'success' }}
    timeout-minutes: 15
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak

      - name: Download x86_64 Flatpak repository
        uses: actions/download-artifact@v8
        with:
          name: flatpak-repo-x86_64
          path: flatpak-repos/x86_64

      - name: Download aarch64 Flatpak repository
        uses: actions/download-artifact@v8
        with:
          name: flatpak-repo-aarch64
          path: flatpak-repos/aarch64

      - name: Configure GPG signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "$FLATPAK_GPG_PASSPHRASE" ]; then
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            echo "default-cache-ttl 7200" >> ~/.gnupg/gpg-agent.conf
            echo "max-cache-ttl 7200" >> ~/.gnupg/gpg-agent.conf
            gpgconf --kill gpg-agent
            gpgconf --launch gpg-agent
            printf 'unlock' > /tmp/gpg-unlock.txt
            gpg --batch --yes --pinentry-mode loopback --passphrase "$FLATPAK_GPG_PASSPHRASE" --local-user "$FLATPAK_GPG_KEY_ID" --output /tmp/gpg-unlock.sig --detach-sign /tmp/gpg-unlock.txt
          fi

      - name: Combine and finalize Flatpak repository
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set -euo pipefail

          mkdir -p flatpak-repo
          cp -a flatpak-repos/x86_64/. flatpak-repo/
          cp -a flatpak-repos/aarch64/objects/. flatpak-repo/objects/
          cp -a flatpak-repos/aarch64/refs/. flatpak-repo/refs/
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY_ID" --generate-static-deltas --prune flatpak-repo

      - name: Verify multi-architecture Flatpak repository
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            test -f "flatpak-repo/refs/heads/app/de.vito0912.yaabsa/${arch}/master"
          done

      - name: Prepare GitHub Pages content
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail

          PAGES_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/"
          HOMEPAGE_URL="https://github.com/${REPO_SLUG}"
          ICON_URL="https://raw.githubusercontent.com/${REPO_SLUG}/master/assets/logo_blue_fill.svg"
          GPG_KEY_B64="$(gpg --export "$FLATPAK_GPG_KEY_ID" | base64 -w 0)"
          mkdir -p flatpak-pages
          cp -R flatpak-repo/. flatpak-pages/
          cp linux/packaging/flatpak/de.vito0912.yaabsa.flatpakrepo flatpak-pages/de.vito0912.yaabsa.flatpakrepo
          sed -i \
            -e "s|__REPO_URL__|${PAGES_URL}|g" \
            -e "s|__HOMEPAGE_URL__|${HOMEPAGE_URL}|g" \
            -e "s|__ICON_URL__|${ICON_URL}|g" \
            -e "s|__GPG_KEY__|${GPG_KEY_B64}|g" \
            flatpak-pages/de.vito0912.yaabsa.flatpakrepo

      - name: Upload Flatpak Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-pages
          path: flatpak-pages

  deploy-pages:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs:
      - combine-flatpak
      - build-web
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download Flatpak Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: flatpak-pages
          path: combined-pages

      - name: Download Web Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: web-pages
          path: combined-pages

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: combined-pages

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v5

  build-android:
    runs-on: ubuntu-latest
    needs:
      - changes
      - check-requirements
    if: ${{ needs.changes.outputs.build_android == 'true' && needs.changes.outputs.build_skip != 'true' }}
    timeout-minutes: 30
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Post Get
        uses: ./.github/actions/post-get
        with:
          flow: build-android

      - name: Setup Keystore
        run: printf '%s' "${{ secrets.STORE }}" | base64 -d > android/keystore.jks

      - name: Build Android Auto appbundle
        run: |
          flutter build appbundle --flavor auto --release
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          STORE_FILE: ${{ secrets.STORE_FILE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Android Auto APKs
        run: |
          flutter build apk --split-per-abi --flavor auto --release
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          STORE_FILE: ${{ secrets.STORE_FILE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Android Automotive appbundle
        run: |
          flutter build appbundle --flavor automotive --release
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          STORE_FILE: ${{ secrets.STORE_FILE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Android Automotive apk
        run: |
          flutter build apk --flavor automotive --release --split-per-abi
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          STORE_FILE: ${{ secrets.STORE_FILE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Wear OS appbundle
        run: |
          flutter build appbundle --flavor wear --release -t lib/main_wear.dart
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          STORE_FILE: ${{ secrets.STORE_FILE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Wear OS apk
        run: |
          flutter build apk --flavor wear --release --split-per-abi -t lib/main_wear.dart
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          STORE_FILE: ${{ secrets.STORE_FILE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename Android artifacts
        shell: bash
        env:
          FILE_VERSION: ${{ needs.changes.outputs.file_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p output/android/auto
          mkdir -p output/android/aaos
          mkdir -p output/android/wear

          auto_bundle_candidates=(build/app/outputs/bundle/autoRelease/*.aab)
          if [[ ${#auto_bundle_candidates[@]} -eq 0 ]]; then
            echo "Android Auto app bundle not found."
            exit 1
          fi
          cp "${auto_bundle_candidates[0]}" "output/android/auto/yaabsa_${FILE_VERSION}.aab"

          auto_apk_candidates=(build/app/outputs/flutter-apk/*auto-release*.apk)
          if [[ ${#auto_apk_candidates[@]} -eq 0 ]]; then
            echo "Android Auto APK artifacts not found."
            exit 1
          fi
          for apk in "${auto_apk_candidates[@]}"; do
            base_name="$(basename "$apk")"
            platform="${base_name#app-auto-}"
            platform="${platform%-release.apk}"
            cp "$apk" "output/android/auto/yaabsa_${platform}_${FILE_VERSION}.apk"
          done

          aaos_bundle_candidates=(build/app/outputs/bundle/automotiveRelease/*.aab)
          if [[ ${#aaos_bundle_candidates[@]} -eq 0 ]]; then
            echo "Android Automotive app bundle not found."
            exit 1
          fi
          cp "${aaos_bundle_candidates[0]}" "output/android/aaos/yaabsa_AAOS_${FILE_VERSION}.aab"

          aaos_apk_candidates=(build/app/outputs/flutter-apk/*automotive-release*.apk)
          if [[ ${#aaos_apk_candidates[@]} -eq 0 ]]; then
            echo "Android Automotive APK artifacts not found."
            exit 1
          fi
          for apk in "${aaos_apk_candidates[@]}"; do
            base_name="$(basename "$apk")"
            platform="${base_name#app-automotive-}"
            platform="${platform%-release.apk}"
            cp "$apk" "output/android/aaos/yaabsa_AAOS_${platform}_${FILE_VERSION}.apk"
          done

          wear_bundle_candidates=(build/app/outputs/bundle/wearRelease/*.aab)
          if [[ ${#wear_bundle_candidates[@]} -eq 0 ]]; then
            echo "Wear OS app bundle not found."
            exit 1
          fi
          cp "${wear_bundle_candidates[0]}" "output/android/wear/yaabsa_wearos_${FILE_VERSION}.aab"

          wear_apk_candidates=(build/app/outputs/flutter-apk/*wear-release*.apk)
          if [[ ${#wear_apk_candidates[@]} -eq 0 ]]; then
            echo "Wear OS APK artifacts not found."
            exit 1
          fi
          for apk in "${wear_apk_candidates[@]}"; do
            base_name="$(basename "$apk")"
            platform="${base_name#app-wear-}"
            platform="${platform%-release.apk}"
            cp "$apk" "output/android/wear/yaabsa_wearos_${platform}_${FILE_VERSION}.apk"
          done

      - name: Upload Android appbundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-appbundle
          path: output/android/auto/*.aab

      - name: Upload Android apk artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: output/android/auto/*.apk

      - name: Upload Android Automotive appbundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-automotive-appbundle
          path: output/android/aaos/*.aab

      - name: Upload Android Automotive apk artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-automotive-apk
          path: output/android/aaos/*.apk

      - name: Upload Wear OS appbundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-wear-appbundle
          path: output/android/wear/*.aab

      - name: Upload Wear OS apk artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-wear-apk
          path: output/android/wear/*.apk

      - name: Clean up
        if: always()
        run: |
          sudo rm -rf build
          sudo rm -rf android/keystore.jks

  build-web:
    runs-on: ubuntu-latest
    needs:
      - changes
      - check-requirements
    if: ${{ needs.changes.outputs.build_web == 'true' && needs.changes.outputs.build_skip != 'true' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Post Get
        uses: ./.github/actions/post-get
        with:
          flow: build-web

      - name: Download Drift WASM files
        run: |
          curl -L https://github.com/simolus3/drift/releases/latest/download/drift_worker.js -o web/drift_worker.js
          curl -L https://github.com/simolus3/sqlite3.dart/releases/latest/download/sqlite3.wasm -o web/sqlite3.wasm

      - name: Build Web
        run: |
          flutter build web --release --wasm

      - name: Upload Web Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: web-pages
          path: build/web

      - name: Package Web bundle artifact
        shell: bash
        env:
          FILE_VERSION: ${{ needs.changes.outputs.file_version }}
        run: |
          set -euo pipefail
          mkdir -p output/web
          cd build/web
          zip -r ../../output/web/yaabsa_web_${FILE_VERSION}.zip .

      - name: Upload Web bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: output/web/yaabsa_*.zip

  build-windows:
    runs-on: windows-latest
    needs:
      - changes
      - check-requirements
    if: ${{ needs.changes.outputs.build_windows == 'true' && needs.changes.outputs.build_skip != 'true' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Post Get
        uses: ./.github/actions/post-get
        with:
          flow: build-windows

      - name: Install packaging tools
        run: |
          dart pub global activate msix
          echo "$env:LOCALAPPDATA\Pub\Cache\bin" >> $env:GITHUB_PATH

      - name: Build Windows bundle
        run: flutter build windows --release

      - name: Build exe installer
        run: pwsh -File windows/packaging/exe/build.ps1

      - name: Build msix installer
        run: pwsh -File windows/packaging/msix/build.ps1

      - name: Build Windows bundle zip
        run: |
          if (Test-Path "build/windows/x64/runner/Release") {
            $bundleDir = "build/windows/x64/runner/Release"
          } elseif (Test-Path "build/windows/runner/Release") {
            $bundleDir = "build/windows/runner/Release"
          } else {
            throw "Windows release bundle not found."
          }
          New-Item -ItemType Directory -Path "output/windows" -Force | Out-Null
          Compress-Archive -Path "$bundleDir/*" -DestinationPath "output/windows/windows-bundle.zip" -Force

      - name: Rename Windows artifacts
        shell: pwsh
        env:
          FILE_VERSION: ${{ needs.changes.outputs.file_version }}
        run: |
          $msix = Get-ChildItem -Path "output/windows" -Filter "*.msix" | Select-Object -First 1
          if (-not $msix) {
            throw "Windows msix artifact not found."
          }
          Move-Item -Path $msix.FullName -Destination ("output/windows/yaabsa_{0}.msix" -f $env:FILE_VERSION) -Force

          $exe = Get-ChildItem -Path "output/windows" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Windows exe artifact not found."
          }
          Move-Item -Path $exe.FullName -Destination ("output/windows/yaabsa_{0}.exe" -f $env:FILE_VERSION) -Force

          $bundleZip = Get-Item "output/windows/windows-bundle.zip" -ErrorAction SilentlyContinue
          if (-not $bundleZip) {
            throw "Windows bundle zip not found."
          }
          Move-Item -Path $bundleZip.FullName -Destination ("output/windows/yaabsa_{0}.zip" -f $env:FILE_VERSION) -Force

      - name: Upload Windows msix artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-msix
          path: output/windows/yaabsa_*.msix

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: output/windows/yaabsa_*.exe

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: output/windows/yaabsa_*.zip

  create-release:
    runs-on: ubuntu-slim
    needs:
      - changes
      - build-linux
      - build-flatpak
      - build-android
      - build-windows
      - build-ios
      - build-macos
      - build-web
    if: ${{ needs.changes.outputs.version_bumped == 'true' && needs.changes.outputs.build_skip != 'true' }}
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          while IFS= read -r -d '' file; do
            rel="${file#release-assets/}"
            artifact_key="${rel%%/*}"
            rel_path="${rel#*/}"

            if [[ "$artifact_key" == "github-pages" || "$artifact_key" == "web-pages" || "$artifact_key" == "flatpak-pages" || "$artifact_key" == flatpak-repo-* ]]; then
              continue
            fi

            flat_name="$(echo "$rel_path" | tr '/' '-')"
            target_name="${artifact_key}-${flat_name}"
            target_file="dist/$target_name"
            if [[ -e "$target_file" ]]; then
              echo "Duplicate release asset name found: $target_name"
              exit 1
            fi
            cp "$file" "$target_file"
          done < <(find release-assets -type f -print0)

          ls -lh dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.changes.outputs.release_tag }}
          name: ${{ needs.changes.outputs.release_tag }}
          prerelease: false
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ${{ needs.changes.outputs.changelog }}

            ---

            This release has been automatically generated from commit ${{ github.sha }}.

            You can download the built artifacts from the "Assets" section below.
          files: |
            dist/*

  publish-android:
    runs-on: ubuntu-slim
    needs: 
      - create-release
      - changes
    if: ${{ needs.changes.outputs.version_bumped == 'true' && needs.changes.outputs.build_skip != 'true' }}
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-appbundle
          path: android-release

      - name: Download Android Automotive artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-automotive-appbundle
          path: android-automotive-release

      - name: Download Android Wear artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-wear-appbundle
          path: android-wear-release

      - name: Move files
        run: |
          mv android-release/*.aab android-release/yaabsa.aab
          mv android-automotive-release/*.aab android-automotive-release/yaabsa_aaos.aab
          mv android-wear-release/*.aab android-wear-release/yaabsa_wear.aab

      - name: Write changelog to whatsnew
        shell: bash
        env:
          CHANGELOG: ${{ needs.changes.outputs.changelog }}
        run: |
          set -euo pipefail
          mkdir -p android/whatsnew
          changelog="$CHANGELOG"
          if [[ ${#changelog} -gt 500 ]]; then
            changelog="${changelog:0:497}..."
          fi
          printf '%s' "$changelog" > android/whatsnew/whatsnew-en-US
          echo "Wrote whatsnew-en-US (${#changelog} chars)"

      - name: Publish Android appbundle to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: de.vito0912.yaabsa
          releaseFiles: android-release/yaabsa.aab
          tracks: alpha,Old,beta
          releaseName: ${{ needs.changes.outputs.release_tag }}
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: android/whatsnew
          changesNotSentForReview: false
        continue-on-error: true

      - name: Publish Android Automotive appbundle to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: de.vito0912.yaabsa
          releaseFiles: android-automotive-release/yaabsa_aaos.aab
          tracks: automotive:AAOS,automotive:beta
          releaseName: ${{ needs.changes.outputs.release_tag }} AAOS
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: android/whatsnew
          changesNotSentForReview: false
        continue-on-error: true

      - name: Publish Wear OS appbundle to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: de.vito0912.yaabsa
          releaseFiles: android-wear-release/yaabsa_wear.aab
          tracks: wear:beta
          releaseName: ${{ needs.changes.outputs.release_tag }} Wear OS
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: android/whatsnew
          changesNotSentForReview: false
        continue-on-error: true

  build-ios:
    runs-on: macos-26
    needs:
      - changes
      - check-requirements
    if: ${{ needs.changes.outputs.build_ios == 'true' && needs.changes.outputs.build_skip != 'true' }}
    timeout-minutes: 25
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Select Xcode 26.4.1
        run: |
          test -d /Applications/Xcode_26.4.1.app
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Post Get
        uses: ./.github/actions/post-get
        with:
          flow: build-ios

      - name: Build Unsigned iOS App
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos
          zip -qq -r yaabsa_${{ needs.changes.outputs.file_version }}_unsigned.ipa Payload

      - name: Upload Unsigned iOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-sideload-build
          path: build/ios/iphoneos/yaabsa_*_unsigned.ipa

      - name: Install iOS Certificate and Profile
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
          IOS_PROV: ${{ secrets.IOS_PROV_PROFILE_BASE64 }}
        if: ${{ needs.changes.outputs.version_bumped == 'true' && needs.changes.outputs.build_skip != 'true' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "runner_temp" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "runner_temp" $KEYCHAIN_PATH
          security set-keychain-settings -t 3600 -u $KEYCHAIN_PATH

          echo -n "$APPLE_CERT" | base64 --decode -o $RUNNER_TEMP/apple_cert.p12
          security import $RUNNER_TEMP/apple_cert.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "runner_temp" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$IOS_PROV" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/ios_app_store.mobileprovision

      - name: Build Signed iOS App (IPA)
        if: ${{ needs.changes.outputs.version_bumped == 'true' && needs.changes.outputs.build_skip != 'true' }}
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload iOS to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        if: ${{ needs.changes.outputs.version_bumped == 'true' && needs.changes.outputs.build_skip != 'true' }}
        with:
          app-path: build/ios/ipa/Yaabsa.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          release-notes: |
            ${{ needs.changes.outputs.changelog }}

            ---
            Please report any issues or feature requests through GitHub or TestFlight. Please note that feature requests shared through TestFlight without an email attached cannot be taken into account as there is no way to contact you. The same applies to bugs that are not easily reproducible. If you do not want to share your email, please use GitHub instead. Thanks for testing iOS!
          wait-for-processing: 'true'
        continue-on-error: true

  build-macos:
    runs-on: macos-26
    needs:
      - changes
      - check-requirements
    if: ${{ needs.changes.outputs.build_macos == 'true' && needs.changes.outputs.build_skip != 'true' }}
    timeout-minutes: 40
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Select Xcode 26.4.1
        run: |
          test -d /Applications/Xcode_26.4.1.app
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Install Developer ID Certificate and Profile
        env:
          MAC_DEVELOPER_ID_CERT: ${{ secrets.MAC_DEVELOPER_ID_CERT_BASE64 }}
          MAC_DEVELOPER_ID_CERT_PW: ${{ secrets.MAC_DEVELOPER_ID_CERT_PASSWORD }}
          MAC_DEVELOPER_ID_PROV: ${{ secrets.MAC_DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          for required_secret in MAC_DEVELOPER_ID_CERT MAC_DEVELOPER_ID_CERT_PW MAC_DEVELOPER_ID_PROV; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required macOS signing secret: $required_secret"
              exit 1
            fi
          done

          keychain_path="$RUNNER_TEMP/yaabsa-developer-id.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          developer_id_profile_path="$profile_dir/yaabsa-mac-gh-developer-id.provisionprofile"

          echo "MAC_DEVELOPER_ID_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "MAC_DEVELOPER_ID_PROFILE_PATH=$developer_id_profile_path" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"

          printf '%s' "$MAC_DEVELOPER_ID_CERT" | base64 --decode -o "$RUNNER_TEMP/mac_developer_id.p12"

          security import "$RUNNER_TEMP/mac_developer_id.p12" -k "$keychain_path" -P "$MAC_DEVELOPER_ID_CERT_PW" -T /usr/bin/codesign

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain

          mkdir -p "$profile_dir"
          printf '%s' "$MAC_DEVELOPER_ID_PROV" | base64 --decode -o "$developer_id_profile_path"

      - name: Install App Store Certificates and Profile
        if: ${{ needs.changes.outputs.version_bumped == 'true' && needs.changes.outputs.build_skip != 'true' }}
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
          MAC_INST_CERT: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          MAC_INST_CERT_PW: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          MAC_PROV: ${{ secrets.MAC_PROV_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          for required_secret in APPLE_CERT APPLE_CERT_PW MAC_INST_CERT MAC_INST_CERT_PW MAC_PROV; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required macOS signing secret: $required_secret"
              exit 1
            fi
          done

          keychain_path="$RUNNER_TEMP/yaabsa-app-store.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          app_store_profile_path="$profile_dir/yaabsa-mac-gh-actions.provisionprofile"

          echo "MAC_APP_STORE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "MAC_APP_STORE_PROFILE_PATH=$app_store_profile_path" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"

          printf '%s' "$APPLE_CERT" | base64 --decode -o "$RUNNER_TEMP/apple_cert.p12"
          printf '%s' "$MAC_INST_CERT" | base64 --decode -o "$RUNNER_TEMP/mac_installer.p12"

          security import "$RUNNER_TEMP/apple_cert.p12" -k "$keychain_path" -P "$APPLE_CERT_PW" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/mac_installer.p12" -k "$keychain_path" -P "$MAC_INST_CERT_PW" -T /usr/bin/codesign -T /usr/bin/productbuild

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$MAC_DEVELOPER_ID_KEYCHAIN_PATH" login.keychain

          mkdir -p "$profile_dir"
          printf '%s' "$MAC_PROV" | base64 --decode -o "$app_store_profile_path"

      - name: Build Signed macOS App (PKG)
        if: ${{ needs.changes.outputs.version_bumped == 'true' && needs.changes.outputs.build_skip != 'true' }}
        run: |
          flutter build macos --release
          
          xcrun productbuild --component "build/macos/Build/Products/Release/yaabsa.app" /Applications --sign "${{ secrets.MAC_INSTALLER_IDENTITY }}" "build/macos/Build/Products/Release/yaabsa.pkg"

      - name: Install Transporter
        if: ${{ needs.changes.outputs.version_bumped == 'true' && needs.changes.outputs.build_skip != 'true' }}
        run: |
          url="https://itunesconnect.apple.com/WebObjects/iTunesConnect.woa/ra/resources/download/public/Transporter__OSX/bin/"
          curl -fsSL "$url" -o "/tmp/itmstransporter.pkg"
          sudo installer -pkg "/tmp/itmstransporter.pkg" -target /
          /usr/local/itms/bin/iTMSTransporter -help

      - name: Upload macOS to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        if: ${{ needs.changes.outputs.version_bumped == 'true' && needs.changes.outputs.build_skip != 'true' }}
        with:
          app-path: build/macos/Build/Products/Release/yaabsa.pkg
          app-type: macos
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          release-notes: |
            ${{ needs.changes.outputs.changelog }}

            ---
            Please report any issues or feature requests through GitHub or TestFlight. Please note that feature requests shared through TestFlight without an email attached cannot be taken into account as there is no way to contact you. The same applies to bugs that are not easily reproducible. If you do not want to share your email, please use GitHub instead. Thanks for testing macOS!
          wait-for-processing: 'true'
          backend: transporter
        continue-on-error: true

      - name: Build Developer ID macOS App
        run: |
          set -euo pipefail

          flutter build macos --release --config-only

          project_file="macos/Runner.xcodeproj/project.pbxproj"
          project_backup="$RUNNER_TEMP/Runner.pbxproj"
          cp "$project_file" "$project_backup"
          restore_project() {
            cp "$project_backup" "$project_file"
          }
          trap restore_project EXIT

          sed -i '' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "3rd Party Mac Developer Application";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Developer ID Application";/' \
            -e 's/"PROVISIONING_PROFILE_SPECIFIER\[sdk=macosx\*\]" = "yaabsa-mac-gh-actions";/"PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]" = "yaabsa-mac-gh-developer-id";/' \
            "$project_file"

          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/yaabsa-developer-id.xcarchive" \
            archive \
            ENABLE_HARDENED_RUNTIME=YES

          app_path="$RUNNER_TEMP/yaabsa-developer-id.xcarchive/Products/Applications/yaabsa.app"
          test -f "$app_path/Contents/embedded.provisionprofile"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Create Signed macOS DMG
        env:
          FILE_VERSION: ${{ needs.changes.outputs.file_version }}
        run: |
          set -euo pipefail

          staging_path="$RUNNER_TEMP/yaabsa-dmg"
          dmg_path="$GITHUB_WORKSPACE/output/macos/yaabsa_${FILE_VERSION}.dmg"
          mkdir -p "$staging_path" "$GITHUB_WORKSPACE/output/macos"
          ditto "$RUNNER_TEMP/yaabsa-developer-id.xcarchive/Products/Applications/yaabsa.app" "$staging_path/yaabsa.app"
          ln -s /Applications "$staging_path/Applications"
          hdiutil create -volname yaabsa -srcfolder "$staging_path" -ov -format UDZO "$dmg_path"
          codesign --force --sign "Developer ID Application" --timestamp "$dmg_path"
          codesign --verify --strict --verbose=2 "$dmg_path"

      - name: Notarize macOS DMG
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          FILE_VERSION: ${{ needs.changes.outputs.file_version }}
        run: |
          set -euo pipefail

          for required_secret in APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required notarization secret: $required_secret"
              exit 1
            fi
          done

          notary_key_path="$RUNNER_TEMP/AuthKey.p8"
          dmg_path="$GITHUB_WORKSPACE/output/macos/yaabsa_${FILE_VERSION}.dmg"
          echo "MAC_NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$notary_key_path"
          chmod 600 "$notary_key_path"

          xcrun notarytool store-credentials yaabsa-notary \
            --key "$notary_key_path" \
            --key-id "$APPSTORE_KEY_ID" \
            --issuer "$APPSTORE_ISSUER_ID" \
            --keychain "$MAC_DEVELOPER_ID_KEYCHAIN_PATH"
          xcrun notarytool submit "$dmg_path" \
            --keychain-profile yaabsa-notary \
            --keychain "$MAC_DEVELOPER_ID_KEYCHAIN_PATH" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-sideload-build
          path: output/macos/yaabsa_*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Clean Up macOS Signing Material
        if: ${{ always() }}
        run: |
          set +e
          security default-keychain -s login.keychain
          if [[ -n "${MAC_APP_STORE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$MAC_APP_STORE_KEYCHAIN_PATH"
          fi
          if [[ -n "${MAC_DEVELOPER_ID_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$MAC_DEVELOPER_ID_KEYCHAIN_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/apple_cert.p12" \
            "$RUNNER_TEMP/mac_installer.p12" \
            "$RUNNER_TEMP/mac_developer_id.p12" \
            "${MAC_APP_STORE_PROFILE_PATH:-}" \
            "${MAC_DEVELOPER_ID_PROFILE_PATH:-}" \
            "${MAC_NOTARY_KEY_PATH:-}"
